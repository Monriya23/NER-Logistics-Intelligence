<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroMarkGrad1" x1="180" y1="130" x2="360" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="heroMarkPoly" x1="200" y1="120" x2="340" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1528" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="heroTextGrad" x1="140" y1="160" x2="400" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10B981" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- 1. Geometric Contour Mark (Visual Height ~120px) -->
  <g transform="translate(270, 72)">
    <!-- Mountain Polygon -->
    <path d="M-68 46 L-26 -28 L0 -4 L24 -36 L68 46 Z" 
          fill="url(#heroMarkPoly)" 
          stroke="url(#heroMarkGrad1)" 
          stroke-width="3.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"
          filter="url(#heroGlow)"/>
    
    <!-- Flowing Arterial Lifeline -->
    <path d="M-74 42 C-42 42, -30 18, -12 18 C6 18, 14 -4, 62 -8" 
          stroke="#10B981" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#lineGlow)"/>
    
    <!-- Interconnected Arterial Nodes -->
    <circle cx="-26" cy="-28" r="5.5" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="0" cy="-4" r="4.5" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="24" cy="-36" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="48" cy="-6" r="4.5" fill="#34D399" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  
  <!-- 2. NEVIA Wordmark Typography -->
  <text x="270" y="194" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="0.18em" 
        fill="url(#heroTextGrad)">NEVIA</text>
  
  <!-- 3. Subtitle / Product Category -->
  <text x="270" y="228" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="12.5" 
        font-weight="700" 
        letter-spacing="0.26em" 
        fill="#94A3B8">REGIONAL MOBILITY INTELLIGENCE</text>
</svg>
